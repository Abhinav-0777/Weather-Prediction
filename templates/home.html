<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Prediction Form</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Weather Prediction</h1>
            {% if prediction %}
        <h2>{{ prediction }}</h2>
            {% endif %}
        <form action="/predict" method="post">

            <label for="Date">Date:</label>
            <input type="date" id="Date" name="Date" required>

            <label for="Location">Location (City):</label>
            <input type="text" id="Location" name="Location" placeholder="Enter city name" required>

            <label for="MinTemp">Min Temperature:</label>
            <input type="number" step="any" id="MinTemp" name="MinTemp" required>

            <label for="MaxTemp">Max Temperature:</label>
            <input type="number" step="any" id="MaxTemp" name="MaxTemp" required>

            <label for="Rainfall">Rainfall:</label>
            <input type="number" step="any" id="Rainfall" name="Rainfall">

            <label for="Evaporation">Evaporation:</label>
            <input type="number" step="any" id="Evaporation" name="Evaporation">

            <label for="Sunshine">Sunshine:</label>
            <input type="number" step="any" id="Sunshine" name="Sunshine">

            <label for="WindGustDir">Wind Gust Direction:</label>
            <input type="text" id="WindGustDir" name="WindGustDir" placeholder="e.g., N, NE, E">

            <label for="WindGustSpeed">Wind Gust Speed:</label>
            <input type="number" step="any" id="WindGustSpeed" name="WindGustSpeed">

            <label for="WindDir9am">Wind Direction 9am:</label>
            <input type="text" id="WindDir9am" name="WindDir9am" placeholder="e.g., N, NE, E">

            <label for="WindDir3pm">Wind Direction 3pm:</label>
            <input type="text" id="WindDir3pm" name="WindDir3pm" placeholder="e.g., N, NE, E">

            <label for="WindSpeed9am">Wind Speed 9am:</label>
            <input type="number" step="any" id="WindSpeed9am" name="WindSpeed9am">

            <label for="WindSpeed3pm">Wind Speed 3pm:</label>
            <input type="number" step="any" id="WindSpeed3pm" name="WindSpeed3pm">

            <label for="Humidity9am">Humidity 9am:</label>
            <input type="number" step="any" id="Humidity9am" name="Humidity9am">

            <label for="Humidity3pm">Humidity 3pm:</label>
            <input type="number" step="any" id="Humidity3pm" name="Humidity3pm">

            <label for="Pressure9am">Pressure 9am:</label>
            <input type="number" step="any" id="Pressure9am" name="Pressure9am">

            <label for="Pressure3pm">Pressure 3pm:</label>
            <input type="number" step="any" id="Pressure3pm" name="Pressure3pm">

            <label for="Cloud9am">Cloud 9am:</label>
            <input type="number" step="any" id="Cloud9am" name="Cloud9am">

            <label for="Cloud3pm">Cloud 3pm:</label>
            <input type="number" step="any" id="Cloud3pm" name="Cloud3pm">

            <label for="Temp9am">Temperature 9am:</label>
            <input type="number" step="any" id="Temp9am" name="Temp9am">

            <label for="Temp3pm">Temperature 3pm:</label>
            <input type="number" step="any" id="Temp3pm" name="Temp3pm">

            <label for="RainToday">Rain Today:</label>
            <select id="RainToday" name="RainToday">
                <option value="">Select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
