name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      DOCKER_USER: ${{secrets.DOCKERHUB_USERNAME}}

    steps:
    - uses: actions/checkout@v4

    - name: Setup python 3.13.5 and pip caching 
      uses: actions/setup-python@v5
      with:
        python-version: "3.13.5"
        cache: "pip"

    - name: Login to Docker hub 
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}

    - name: Install the dependencies
      run: |
        python -m pip install --upgrade pip
        if  [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint the code
      run: ruff check .

    - name: Run pytest
      run: PYTHONPATH=. pytest -v

    - name: Build Docker image
      run: | 
        docker build -t $DOCKER_USER/weather-actions:${{github.sha}} \
        -t $DOCKER_USER/weather-actions:latest \
        .

    - name: Push Docker image with .sha tag
      if: github.ref == 'refs/heads/main'
      run: docker push $DOCKER_USER/weather-actions:${{github.sha}}

    - name: Push Docker image with latest tag
      if: github.ref == 'refs/heads/main'
      run: docker push $DOCKER_USER/weather-actions:latest 